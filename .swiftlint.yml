included:
  - Package.swift
  - Sources
  - Tests
  - Fixtures/CallerOnlyConsumer/Package.swift
  - Fixtures/CallerOnlyConsumer/Sources

excluded:
  - .build
  - .swiftpm
  - Sources/InferPeerProtocol/Generated
  - Sources/InferPeerGRPC/Generated

strict: true

disabled_rules:
  - opening_brace
  - trailing_comma

opt_in_rules:
  - async_without_await
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - last_where
  - modifier_order
  - operator_usage_whitespace
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

cyclomatic_complexity:
  warning: 10
  error: 15
  ignores_case_statements: false

file_length:
  warning: 400
  error: 600

function_body_length:
  warning: 40
  error: 60

function_parameter_count:
  warning: 5
  error: 7

large_tuple:
  warning: 3
  error: 4

line_length:
  warning: 100
  error: 120
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 250
  error: 350

reporter: xcode
